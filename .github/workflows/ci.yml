name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Every optional extra is installed below, so a skip here means a test
      # quietly stopped running. Turn those skips into failures.
      BLACKBOARD_REQUIRE_EXTRAS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with every extra
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Tests, and no test may be skipped
        run: |
          set -o pipefail
          pytest -rs 2>&1 | tee /tmp/out
          if grep -qE '[0-9]+ skipped' /tmp/out; then
            echo "::error::a test was skipped in a fully-installed environment"
            exit 1
          fi
